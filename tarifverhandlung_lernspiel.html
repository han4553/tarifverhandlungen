<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tarifverhandlung – Lernspiel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap');

:root {
  --ink:#1a1612; --paper:#f9f6f0; --cream:#f0ebe0;
  --red:#b83030; --red-light:#fdf0f0; --red-mid:#e8c0c0;
  --blue:#1d4e89; --blue-light:#eef4fc; --blue-mid:#b8d0ee;
  --green:#1a5c2e; --green-light:#edf7f0; --green-mid:#a8d4b4;
  --amber:#7a4a00; --amber-light:#fef8ee; --amber-mid:#f0d090;
  --gray:#5a5550; --border:#d8d0c0; --shadow:rgba(26,22,18,.08);
  --serif:'Source Serif 4',Georgia,serif;
  --sans:'DM Sans','Helvetica Neue',sans-serif;
  --display:'Bebas Neue',Impact,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--cream)}
body{font-family:var(--serif);color:var(--ink);overflow:hidden}

.app{max-width:440px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 40px var(--shadow)}

/* ── TOP BAR ── */
.topbar{background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex-shrink:0}
.topbar-title{font-family:var(--display);font-size:18px;letter-spacing:2px}
.topbar-score{font-family:var(--sans);font-size:12px;color:rgba(249,246,240,.6)}
.topbar-score span{color:var(--paper);font-weight:500;font-size:14px}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn-fullscreen{background:rgba(249,246,240,.12);border:1px solid rgba(249,246,240,.2);color:var(--paper);border-radius:5px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:background .15s;padding:0;flex-shrink:0}
.btn-fullscreen:hover{background:rgba(249,246,240,.22)}
.btn-fullscreen:active{transform:scale(.92)}

/* ── PHASE STRIP ── */
.phasestrip{display:flex;background:var(--cream);border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden}
.phaseitem{flex:1;padding:6px 4px;text-align:center;font-family:var(--sans);font-size:9px;letter-spacing:.04em;color:var(--gray);border-right:1px solid var(--border);transition:all .3s;position:relative;line-height:1.3}
.phaseitem:last-child{border-right:none}
.phaseitem.done{background:var(--green-light);color:var(--green)}
.phaseitem.active{background:var(--ink);color:var(--paper);font-weight:500}
.phaseitem.done::after{content:'✓';position:absolute;top:2px;right:3px;font-size:8px;color:var(--green)}

/* ── SCROLL BODY ── */
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:16px}

/* ── TYPOGRAPHY ── */
h1{font-family:var(--display);font-size:36px;letter-spacing:2px;line-height:1;color:var(--ink);margin-bottom:6px}
h2{font-family:var(--display);font-size:22px;letter-spacing:1px;color:var(--ink);margin-bottom:8px}
h3{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink);margin-bottom:6px}
p{font-size:14px;line-height:1.65;color:var(--gray);margin-bottom:10px}
.lead{font-size:15px;line-height:1.6;color:var(--ink)}

/* ── CARDS ── */
.card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.card-red{border-left:3px solid var(--red);background:var(--red-light)}
.card-blue{border-left:3px solid var(--blue);background:var(--blue-light)}
.card-green{border-left:3px solid var(--green);background:var(--green-light)}
.card-amber{border-left:3px solid var(--amber);background:var(--amber-light)}
.card-ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card-ink p,.card-ink h3{color:rgba(249,246,240,.8)}
.card-ink h2{color:var(--paper)}

/* ── BEGRIFFE ── */
.begriffs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.begriff{background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px;cursor:pointer;transition:all .2s}
.begriff:active{transform:scale(.97)}
.begriff-word{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink);margin-bottom:3px}
.begriff-short{font-size:11px;color:var(--gray);line-height:1.4}
.begriff.expanded{grid-column:span 2;border-color:var(--blue);background:var(--blue-light)}
.begriff-detail{font-size:12px;line-height:1.6;color:var(--blue);margin-top:6px;display:none}
.begriff.expanded .begriff-detail{display:block}

/* ── STATS ROW ── */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--cream);border-radius:6px;padding:10px;text-align:center}
.stat-val{font-family:var(--display);font-size:26px;letter-spacing:1px;line-height:1}
.stat-label{font-family:var(--sans);font-size:10px;color:var(--gray);margin-top:2px;letter-spacing:.03em}
.stat.green .stat-val{color:var(--green)}
.stat.red .stat-val{color:var(--red)}
.stat.blue .stat-val{color:var(--blue)}
.stat.amber .stat-val{color:var(--amber)}

/* ── SLIDER ── */
.slider-section{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.slider-head-label{font-family:var(--sans);font-size:13px;font-weight:500}
.slider-head-val{font-family:var(--display);font-size:24px;letter-spacing:1px;color:var(--blue)}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none;margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);cursor:pointer;box-shadow:0 2px 6px var(--shadow)}
.slider-labels{display:flex;justify-content:space-between;font-family:var(--sans);font-size:10px;color:var(--gray);margin-top:2px}
.slider-context{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.slider-ctx-item{background:var(--cream);border-radius:4px;padding:7px 6px;text-align:center}
.slider-ctx-val{font-family:var(--display);font-size:17px;letter-spacing:.5px}
.slider-ctx-label{font-size:9px;color:var(--gray);font-family:var(--sans);letter-spacing:.03em;line-height:1.3;margin-top:1px}

/* ── QUIZ ── */
.quiz-progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:12px;overflow:hidden}
.quiz-progress-fill{height:100%;background:var(--ink);border-radius:2px;transition:width .4s ease}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.quiz-counter{font-family:var(--sans);font-size:11px;color:var(--gray)}
.quiz-score{font-family:var(--sans);font-size:11px;font-weight:500}
.quiz-tag{display:inline-block;font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.05em;background:var(--ink);color:var(--paper);padding:3px 9px;border-radius:3px;margin-bottom:8px}
.quiz-q{font-size:16px;line-height:1.5;margin-bottom:14px;font-style:italic}
.quiz-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.quiz-opt{background:#fff;border:1px solid var(--border);border-radius:6px;padding:11px 14px;font-size:14px;line-height:1.4;cursor:pointer;text-align:left;font-family:var(--serif);color:var(--ink);transition:all .18s;display:flex;align-items:flex-start;gap:10px}
.quiz-opt-letter{font-family:var(--display);font-size:16px;color:var(--gray);flex-shrink:0;line-height:1.3;width:16px}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.ok{background:var(--green-light);border-color:var(--green);color:var(--green)}
.quiz-opt.ok .quiz-opt-letter{color:var(--green)}
.quiz-opt.bad{background:var(--red-light);border-color:var(--red);color:var(--red)}
.quiz-opt.bad .quiz-opt-letter{color:var(--red)}
.quiz-opt.reveal{background:var(--green-light);border-color:var(--green-mid);color:var(--green);opacity:.7}
.quiz-opt:disabled{cursor:default}
.quiz-expl{background:var(--cream);border-left:3px solid var(--ink);border-radius:0 6px 6px 0;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--ink);display:none;margin-bottom:8px}
.quiz-expl.show{display:block;animation:fadeIn .3s ease}
.quiz-expl-hed{font-family:var(--sans);font-size:11px;font-weight:500;margin-bottom:4px;color:var(--gray)}
.quiz-connection{background:var(--blue-light);border:1px solid var(--blue-mid);border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--blue);display:none;margin-bottom:8px}
.quiz-connection.show{display:block}
.quiz-connection strong{color:var(--blue);font-style:normal}

/* ── SPEECH BUBBLES ── */
.dialog{margin-bottom:10px}
.bubble-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.bubble-row.right{flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--ink);color:var(--paper)}
.avatar.ag{background:var(--amber-mid)}
.bubble{border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.55;max-width:82%;position:relative}
.bubble-gew{background:var(--ink);color:var(--paper);border-radius:10px 10px 10px 2px}
.bubble-ag{background:var(--cream);border:1px solid var(--border);border-radius:10px 10px 2px 10px}
.bubble-name{font-family:var(--sans);font-size:9px;font-weight:500;color:var(--gray);margin-bottom:3px}
.bubble-gew .bubble-name{color:rgba(249,246,240,.6)}

/* ── ACTION BUTTONS ── */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.action{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;text-align:left;transition:all .18s;font-family:var(--serif)}
.action:active{transform:scale(.97)}
.action-icon{font-size:20px;margin-bottom:6px;display:block}
.action-name{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink);margin-bottom:3px}
.action-desc{font-size:11px;color:var(--gray);line-height:1.4}
.action-effect{font-size:10px;font-family:var(--sans);margin-top:4px;padding:2px 6px;border-radius:3px;display:inline-block}
.action.strat-ok{border-color:var(--green);background:var(--green-light)}
.action.strat-ok .action-name{color:var(--green)}
.action.strat-warn{border-color:var(--amber);background:var(--amber-light)}
.action.strat-warn .action-name{color:var(--amber)}
.action.strat-bad{border-color:var(--red);background:var(--red-light)}
.action.strat-bad .action-name{color:var(--red)}
.action.disabled-action{opacity:.4;cursor:not-allowed;pointer-events:none}
.action-full{grid-column:span 2}

/* ── BUTTONS ── */
.btn{display:block;width:100%;padding:13px;border:none;border-radius:6px;font-family:var(--display);font-size:18px;letter-spacing:2px;cursor:pointer;transition:all .15s;margin-bottom:8px}
.btn:active{transform:scale(.97)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink:hover{opacity:.9}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--gray);font-size:14px;padding:10px}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}

/* ── RESULT BOX ── */
.rbox{border-radius:6px;padding:11px 14px;font-size:13px;line-height:1.6;margin-bottom:10px;border-left:3px solid}
.rbox.ok{background:var(--green-light);border-color:var(--green);color:var(--green)}
.rbox.bad{background:var(--red-light);border-color:var(--red);color:var(--red)}
.rbox.info{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}
.rbox.warn{background:var(--amber-light);border-color:var(--amber);color:var(--amber)}

/* ── TABLE ── */
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
th{text-align:left;padding:6px 8px;font-family:var(--sans);font-size:10px;letter-spacing:.05em;color:var(--gray);border-bottom:1px solid var(--border)}
td{padding:7px 8px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:none}
.td-r{text-align:right;font-family:var(--sans);font-weight:500}
.td-green{color:var(--green)}
.td-red{color:var(--red)}

/* ── GLOSSAR ── */
.glossar-entry{border-bottom:1px solid var(--border);padding:10px 0}
.glossar-entry:last-child{border-bottom:none}
.glossar-term{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.glossar-term-tag{font-size:10px;background:var(--cream);border:1px solid var(--border);border-radius:3px;padding:1px 6px;color:var(--gray);font-weight:400}
.glossar-def{font-size:13px;line-height:1.65;color:var(--gray);margin-top:6px;display:none;padding-left:0}
.glossar-def.open{display:block}
.glossar-bsp{background:var(--cream);border-radius:4px;padding:7px 10px;margin-top:6px;font-size:12px;font-style:italic;color:var(--ink);line-height:1.5}
.glossar-bsp::before{content:'Beispiel: ';font-style:normal;font-weight:500;color:var(--gray)}
.glossar-zusammenhang{font-size:12px;color:var(--blue);margin-top:6px;line-height:1.5}
.glossar-zusammenhang::before{content:'↔ Zusammenhang: ';font-weight:500}

/* ── LERNKARTE ── */
.lernkarte{background:var(--ink);color:var(--paper);border-radius:8px;padding:16px;margin-bottom:10px}
.lernkarte-frage{font-style:italic;font-size:15px;line-height:1.5;margin-bottom:10px}
.lernkarte-antwort{font-size:13px;line-height:1.65;color:rgba(249,246,240,.85);border-top:1px solid rgba(249,246,240,.15);padding-top:10px;display:none}
.lernkarte-antwort.show{display:block}
.lernkarte-btn{background:rgba(249,246,240,.1);border:1px solid rgba(249,246,240,.2);color:var(--paper);font-family:var(--sans);font-size:12px;padding:6px 14px;border-radius:4px;cursor:pointer;margin-top:8px}

/* ── TABS ── */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:12px;gap:0}
.tab{flex:1;padding:9px 6px;font-family:var(--sans);font-size:11px;text-align:center;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.03em}
.tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}

/* ── VERHANDLUNGSTHERMOMETER ── */
.thermo-wrap{margin-bottom:12px}
.thermo-bar{position:relative;height:20px;background:linear-gradient(to right,var(--red-light),var(--amber-light),var(--green-light));border-radius:10px;border:1px solid var(--border);overflow:visible;margin-bottom:6px}
.thermo-ag{position:absolute;top:-4px;width:12px;height:28px;border-radius:6px;background:var(--amber);transition:left .5s ease;transform:translateX(-50%)}
.thermo-gew{position:absolute;top:-4px;width:12px;height:28px;border-radius:6px;background:var(--blue);transition:left .5s ease;transform:translateX(-50%)}
.thermo-zone{position:absolute;top:0;height:100%;background:rgba(26,92,46,.15);border-radius:6px;transition:all .5s ease}
.thermo-labels{display:flex;justify-content:space-between;font-family:var(--sans);font-size:9px;color:var(--gray)}
.thermo-legend{display:flex;gap:12px;margin-top:6px;font-family:var(--sans);font-size:10px;color:var(--gray)}
.thermo-leg-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.anim{animation:fadeIn .35s ease}
.score-pop{animation:scorePop .4s ease}
@keyframes scorePop{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--border);margin:14px 0}
.section-label{font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--gray);text-transform:uppercase;margin-bottom:8px}
.pill{display:inline-block;font-family:var(--sans);font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;margin-right:4px;margin-bottom:4px}
.pill-green{background:var(--green-light);color:var(--green);border:1px solid var(--green-mid)}
.pill-red{background:var(--red-light);color:var(--red);border:1px solid var(--red-mid)}
.pill-blue{background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-mid)}
.pill-amber{background:var(--amber-light);color:var(--amber);border:1px solid var(--amber-mid)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-title">TARIFVERHANDLUNG</div>
    <div class="topbar-right">
      <div class="topbar-score">Punkte: <span id="score-disp">0</span></div>
      <button class="btn-fullscreen" id="btn-fs" title="Vollbild" onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>
  <div id="phasestrip" class="phasestrip"></div>
  <div class="body" id="mainbody">
    <div class="pad" id="content"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════
   DATEN
════════════════════════════════════════════════════ */

const GLOSSAR = [
  {
    term:'Tarifvertrag',tag:'Kernbegriff',
    def:'Ein Tarifvertrag ist ein schriftlicher Vertrag zwischen einer <strong>Gewerkschaft</strong> und einem <strong>Arbeitgeberverband</strong> (oder einzelnem Arbeitgeber), der Mindestarbeitsbedingungen für eine gesamte Branche oder einen Betrieb festlegt.',
    bsp:'Der Flächentarifvertrag der Metall- und Elektroindustrie gilt für alle Beschäftigten der Mitgliedsbetriebe des AG-Verbands — egal ob sie Gewerkschaftsmitglied sind oder nicht.',
    zusammenhang:'Grundlage der Tarifautonomie · Unterschied zum Einzelarbeitsvertrag · Kann allgemeinverbindlich erklärt werden'
  },
  {
    term:'Tarifautonomie',tag:'Verfassungsrecht',
    def:'Das in <strong>Art. 9 Abs. 3 GG</strong> verankerte Recht von Gewerkschaften und Arbeitgeberverbänden, Arbeitsbedingungen <strong>ohne staatliche Einmischung</strong> eigenständig zu regeln. Der Staat darf weder Tarifinhalte vorschreiben noch Abschlüsse verbieten.',
    bsp:'Der Staat legt keinen Lohn für Metallarbeiter fest — das regeln IG Metall und Gesamtmetall unter sich.',
    zusammenhang:'Art. 9 Abs. 3 GG · Koalitionsfreiheit · Abgrenzung zum gesetzlichen Mindestlohn'
  },
  {
    term:'Friedenspflicht',tag:'Arbeitskampfrecht',
    def:'Während eines <strong>laufenden Tarifvertrags</strong> sind Streiks und Aussperrungen verboten. Erst nach Ablauf des Vertrags und dem Scheitern der Verhandlungen darf der Arbeitskampf beginnen.',
    bsp:'Solange der IG-Metall-Tarifvertrag bis Ende Oktober gilt, darf die Gewerkschaft keinen Streik ausrufen — erst danach ist sie frei.',
    zusammenhang:'Läuft parallel zum Tarifvertrag · Endet mit Ablauf · Ausnahme: Unterstützungsstreik'
  },
  {
    term:'Warnstreik',tag:'Arbeitskampf',
    def:'Ein <strong>kurzfristiger, befristeter Streik</strong> (Stunden bis maximal ein Tag), der während laufender Tarifverhandlungen nach Ablauf der Friedenspflicht eingesetzt wird, um Druck auf die Arbeitgeberseite zu erhöhen — ohne gleich in den Vollstreik zu gehen.',
    bsp:'GDL-Lokführer legen die Arbeit für 3 Stunden nieder, um die Deutsche Bahn zu mehr Angebot zu bewegen.',
    zusammenhang:'Schwächeres Mittel als Vollstreik · Setzt Urabstimmung voraus · Abgrenzung: wilder Streik (rechtswidrig)'
  },
  {
    term:'Schlichtung',tag:'Konfliktlösung',
    def:'Wenn Verhandlungen scheitern, kann eine <strong>neutrale Schlichterin oder ein Schlichter</strong> eingesetzt werden, der zwischen den Parteien vermittelt und einen Kompromissvorschlag unterbreitet. Beide Seiten müssen dem Schlichter zustimmen.',
    bsp:'Hans-Jochen Vogel (SPD) schlichtete 1984 den Tarifkonflikt der Metaller um die 35-Stunden-Woche.',
    zusammenhang:'Alternative zum Streik · Schlichterspruch ist kein Urteil · Kann scheitern → dann Urabstimmung'
  },
  {
    term:'Aussperrung',tag:'Arbeitskampf',
    def:'Das Gegenstück zum Streik auf <strong>Arbeitgeberseite</strong>: Der Arbeitgeber schließt Arbeitnehmer vom Betrieb aus und zahlt keinen Lohn. Ziel ist es, den wirtschaftlichen Druck auf die Gewerkschaft zu erhöhen.',
    bsp:'Im Druckereistreik 1984 sperrten Verlage Beschäftigte für mehrere Wochen aus, um Gewerkschaftsmitglieder in Regionen ohne Streikaufruf unter Druck zu setzen.',
    zusammenhang:'Gegenstück zum Streik · Umstritten: BVerfG ließ sie 1991 grundsätzlich zu · Selten eingesetzt'

const PHASE_NAMES = ['Vorbereitung','Lerncheck','Verhandlung','Abschluss','Auswertung'];

function setScreen(s){ G.screen=s; render(); }
function addScore(n){ G.score+=n; G.maxScore+=10; animScore(); }
function animScore(){ const el=document.getElementById('score-disp'); if(el){el.textContent=G.score; el.classList.add('score-pop'); setTimeout(()=>el.classList.remove('score-pop'),400);} }
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

/* ════════════════════════════════════════════════════
   PHASE STRIP
════════════════════════════════════════════════════ */
function renderPhaseStrip(){
  const strip=document.getElementById('phasestrip');
  strip.innerHTML=PHASE_NAMES.map((n,i)=>`<div class="phaseitem ${i<G.phaseIdx?'done':i===G.phaseIdx?'active':''}">${n}</div>`).join('');
}

/* ════════════════════════════════════════════════════
   MASTER RENDER
════════════════════════════════════════════════════ */
function render(){
  renderPhaseStrip();
  document.getElementById('score-disp').textContent=G.score;
  const c=document.getElementById('content');
  c.className='pad anim';
  if(G.screen==='start')       c.innerHTML=renderStart();
  else if(G.screen==='vorbereitung') c.innerHTML=renderVorbereitung();
  else if(G.screen==='quiz_vor')     c.innerHTML=renderQuiz('vor');
  else if(G.screen==='verhandlung')  c.innerHTML=renderVerhandlung();
  else if(G.screen==='abschluss')    c.innerHTML=renderAbschluss();
  else if(G.screen==='quiz_nach')    c.innerHTML=renderQuiz('nach');
  else if(G.screen==='ergebnis')     c.innerHTML=renderErgebnis();
  else if(G.screen==='glossar')      c.innerHTML=renderGlossar();
  document.getElementById('mainbody').scrollTop=0;
  attachAll();
}

function startQuizVor(){
  G.phaseIdx=1;
  G.quizPhase='vor';
  G.quizQueue=shuffle(FRAGEN.filter(f=>f.phase==='vor')).slice(0,3);
  G.quizIdx=0; G.quizAnswered=false;
  G.screen='quiz_vor';
  render();
}

function startQuizNach(){
  G.phaseIdx=4;
  G.quizPhase='nach';
  G.quizQueue=shuffle(FRAGEN.filter(f=>f.phase==='nach'||f.phase==='waehrend'));
  G.quizIdx=0; G.quizAnswered=false;
  G.screen='quiz_nach';
  render();
}

function renderQuiz(phase){
  const q=G.quizQueue[G.quizIdx];
  if(!q) { if(phase==='vor'){goVerhandlung();return '';} else {G.screen='ergebnis';render();return '';} }
  const total=G.quizQueue.length;
  const pct=Math.round(G.quizIdx/total*100);
  const letters=['A','B','C','D'];
  return `
  <div class="quiz-progress"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
  <div class="quiz-meta">
    <span class="quiz-counter">Frage ${G.quizIdx+1} von ${total}</span>
    <span class="quiz-score">${G.score} Punkte</span>
  </div>
  <div class="quiz-tag">${q.kategorie}</div>
  <div class="quiz-q">${q.frage}</div>
  <div class="quiz-opts">
    ${q.opts.map((o,i)=>{
      let cls='quiz-opt';
      if(G.quizAnswered){
        if(i===q.r) cls+=' ok';
        else if(i===G.lastChoice) cls+=' bad';
        else cls+=' quiz-opt';
      }
      return `<button class="${cls}" ${G.quizAnswered?'disabled':''} onclick="answerQuiz(${i})">
        <span class="quiz-opt-letter">${letters[i]}</span><span>${o}</span>
      </button>`;
    }).join('')}
  </div>
  ${G.quizAnswered?`
  <div class="quiz-expl show">
    <div class="quiz-expl-hed">${G.quizCorrect?'✓ Richtig!':'✗ Leider falsch.'}</div>
    ${q.erklaerung}
  </div>
  <div class="quiz-connection show">
    <strong>Zusammenhang:</strong> ${q.zusammenhang}
  </div>
  <button class="btn btn-ink" onclick="nextQuiz('${phase}')">${G.quizIdx+1<total?'Nächste Frage →':'Weiter →'}</button>
  `:''}`;
}

function answerQuiz(i){
  if(G.quizAnswered) return;
  G.quizAnswered=true; G.lastChoice=i;
  const q=G.quizQueue[G.quizIdx];
  G.quizCorrect=i===q.r;
  addScore(G.quizCorrect?10:3);
  render();
}

function nextQuiz(phase){
  G.quizIdx++;G.quizAnswered=false;
  const q=G.quizQueue[G.quizIdx];
  if(!q){
    if(phase==='vor') goVerhandlung();
    else { G.screen='ergebnis'; G.phaseIdx=4; render(); }
    return;
  }
  render();
}

/* ════════════════════════════════════════════════════
   VERHANDLUNG
════════════════════════════════════════════════════ */
function goVerhandlung(){
  G.phaseIdx=2; G.screen='verhandlung';
  G.verhandlungsRunde=0; G.letzteAktion=null;
  G.gegenangebot=1.8+Math.random()*0.6;
  G.dialoge=[];
  G.inMidRound=false;
  render();
}

function renderVerhandlung(){
  G.phaseIdx=2;
  const runde=G.verhandlungsRunde;
  const lf=G.lohnForderung;
  const ga=G.gegenangebot;
  const diff=lf-ga;
  const mitte=((lf+ga)/2);
  const einigbar=diff<=3.0;
  const quizWaehrend = G.quizWaehrendOffen;

  if(quizWaehrend){
    return renderQuizWaehrend();
  }

  let dialoge=G.dialoge||[];
  if(runde===0 && dialoge.length===0){
    dialoge=[
      {side:'ag',text:`Wir bieten +${ga.toFixed(1)} %. Die wirtschaftliche Lage lässt mehr nicht zu.`},
      {side:'gew',text:`Wir fordern +${lf.toFixed(1)} %. Die Inflation liegt bei 4,2 % — die Beschäftigten haben bereits Reallohnverluste erlitten.`},
    ];
    G.dialoge=dialoge;
  }

  return `
  <h2>Verhandlungs­runde ${runde+1}</h2>

  <div class="thermo-wrap">
    <div class="section-label">Verhandlungsthermometer</div>
    <div class="thermo-bar">
      <div class="thermo-zone" style="left:${posThermo(ga)}%;width:${posThermo(lf)-posThermo(ga)}%"></div>
      <div class="thermo-ag" style="left:${posThermo(ga)}%" title="AG-Angebot"></div>
      <div class="thermo-gew" style="left:${posThermo(lf)}%" title="Deine Forderung"></div>
    </div>
    <div class="thermo-labels"><span>0 %</span><span>3 %</span><span>6 %</span><span>9 %</span><span>12 %</span></div>
    <div class="thermo-legend">
      <span><span class="thermo-leg-dot" style="background:var(--blue)"></span>Deine Forderung: +${lf.toFixed(1)} %</span>
      <span><span class="thermo-leg-dot" style="background:var(--amber)"></span>AG-Angebot: +${ga.toFixed(1)} %</span>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat blue"><div class="stat-val">+${lf.toFixed(1)} %</div><div class="stat-label">Deine Forderung</div></div>
    <div class="stat amber"><div class="stat-val">+${ga.toFixed(1)} %</div><div class="stat-label">AG-Angebot</div></div>
    <div class="stat ${diff<=2?'green':'red'}"><div class="stat-val">${diff.toFixed(1)}</div><div class="stat-label">Abstand (%-Pkt.)</div></div>
    <div class="stat ${mitte>=4.2?'green':'red'}"><div class="stat-val">${mitte.toFixed(1)} %</div><div class="stat-label">Möglicher Kompromiss</div></div>
  </div>

  ${einigbar?`<div class="rbox info">Die Positionen sind nah beieinander. Eine Einigung ist möglich.</div>`:''}
  ${mitte<4.2?`<div class="rbox warn">Ein Abschluss auf Kompromisskurs (+${mitte.toFixed(1)} %) läge unter der Inflation (4,2 %) — Reallohnverlust!</div>`:''}

  <div class="dialog" style="margin-bottom:10px">
    ${dialoge.slice(-4).map(d=>renderBubble(d)).join('')}
  </div>

  <div class="section-label">Deine nächste Aktion</div>
  <div class="action-grid">
    ${VERHANDLUNGS_AKTIONEN.map(a=>`
    <div class="action" onclick="doAktion('${a.id}')">
      <span class="action-icon">${a.icon}</span>
      <div class="action-name">${a.name}</div>
      <div class="action-desc">${a.desc}</div>
    </div>`).join('')}
  </div>
  <div class="action-grid" style="margin-top:0">
    <div class="action action-full ${ga>=lf*0.82?'strat-ok':'strat-warn'}" onclick="doAktion('einigen')">
      <div class="action-name">Einigung annehmen (+${ga.toFixed(1)} %)</div>
      <div class="action-desc">Tarifvertrag zu diesen Bedingungen abschließen</div>
      <div class="action-effect pill-${ga>=4.2?'green':'amber'}">${ga>=4.2?'Reallohnzuwachs':'Reallohnverlust: '+(ga-4.2).toFixed(1)+' %'}</div>
    </div>
    ${runde>=2?`<div class="action action-full strat-bad" onclick="doAktion('scheitern')">
      <div class="action-name">Verhandlung abbrechen</div>
      <div class="action-desc">→ Schlichtung oder Urabstimmung</div>
    </div>`:``}
  </div>`;
}

function posThermo(val){
  return Math.min(98,Math.max(2,val/12*100));
}

function renderBubble(d){
  const isGew=d.side==='gew';
  return `<div class="bubble-row ${isGew?'':''}">
    <div class="avatar ${isGew?'':'ag'}">${isGew?'✊':'💼'}</div>
    <div>
      <div class="bubble-name" style="padding-left:4px;margin-bottom:2px">${isGew?'Du (Gewerkschaft)':'AG-Vertreter'}</div>
      <div class="bubble ${isGew?'bubble-gew':'bubble-ag'}">${d.text}</div>
    </div>
  </div>`;
}

function doAktion(id){
  if(id==='einigen'){
    G.finalDeal=G.gegenangebot;
    G.phaseIdx=3; G.screen='abschluss'; render(); return;
  }
  if(id==='scheitern'){
    G.scheitern=true; G.phaseIdx=3; G.screen='abschluss'; render(); return;
  }
  G.verhandlungsRunde++;
  const a=VERHANDLUNGS_AKTIONEN.find(x=>x.id===id);
  let dialoge=G.dialoge||[];
  let agText='',gewText='',agNeu=G.gegenangebot;

  if(id==='konzession'){
    const s=Math.max(0.4,(G.lohnForderung-G.gegenangebot)*0.3);
    G.lohnForderung=Math.max(G.gegenangebot+0.2,G.lohnForderung-s);
    agNeu=Math.min(G.gegenangebot+0.25,G.lohnForderung-0.1);
    gewText=`Wir gehen auf +${G.lohnForderung.toFixed(1)} % — das zeigt unsere Kompromissbereitschaft.`;
    agText=`Wir schätzen das. Wir erhöhen auf +${agNeu.toFixed(1)} %.`;
    addScore(6);
  } else if(id==='sacharg'){
    agNeu=Math.min(G.gegenangebot+0.5,G.lohnForderung*0.88);
    gewText=`Produktivitätssteigerung +3,1 %, Unternehmensgewinn +18 %, Inflation 4,2 %. Unsere Forderung ist faktenbasiert.`;
    agText=`Die Zahlen sind bekannt. Wir erhöhen auf +${agNeu.toFixed(1)} % — das ist unser verbessertes Angebot.`;
    addScore(8);
  } else if(id==='druck'){
    agNeu=Math.min(G.gegenangebot+0.4,G.lohnForderung*0.85);
    gewText=`Der Rückhalt unserer Mitglieder ist hoch. Bei Scheitern rufen wir zum Warnstreik auf.`;
    agText=`Wir nehmen das zur Kenntnis. +${agNeu.toFixed(1)} % — aber mehr ist nicht möglich.`;
    addScore(7);
  } else if(id==='schlichtung'){
    const komp=(G.lohnForderung+G.gegenangebot)/2;
    agNeu=komp-0.15;
    G.lohnForderung=komp+0.2;
    gewText=`Wir schlagen eine Schlichtung vor. Eine neutrale Vermittlerin soll helfen.`;
    agText=`Einverstanden. Die Schlichterin empfiehlt einen Kompromiss bei +${komp.toFixed(1)} %. Wir bieten +${agNeu.toFixed(1)} %.`;
    addScore(7);
  }
  G.gegenangebot=agNeu;
  dialoge.push({side:'gew',text:gewText},{side:'ag',text:agText});
  G.dialoge=dialoge;

  // Nach bestimmten Aktionen: Wissensfrage einblenden
  if(G.verhandlungsRunde===2 && !G.quizWaehrendGetan){
    G.quizWaehrendOffen=true;
    G.quizWaehrendGetan=true;
    G.quizQueue=shuffle(FRAGEN.filter(f=>f.phase==='waehrend'));
    G.quizIdx=0; G.quizAnswered=false;
  }

  if(Math.abs(G.lohnForderung-G.gegenangebot)<0.35 || G.verhandlungsRunde>=6){
    G.finalDeal=(G.lohnForderung+G.gegenangebot)/2;
    G.phaseIdx=3; G.screen='abschluss'; render(); return;
  }
  render();
}

function renderQuizWaehrend(){
  const q=G.quizQueue[G.quizIdx];
  if(!q){G.quizWaehrendOffen=false;render();return '';}
  const letters=['A','B','C','D'];
  return `
  <div class="card card-amber" style="margin-bottom:10px">
    <h3>Kurze Lernpause!</h3>
    <p style="margin:0">Bevor du weiterverhandelst — eine wichtige Frage:</p>
  </div>
  <div class="quiz-tag">${q.kategorie}</div>
  <div class="quiz-q">${q.frage}</div>
  <div class="quiz-opts">
    ${q.opts.map((o,i)=>{
      let cls='quiz-opt';
      if(G.quizAnswered){if(i===q.r)cls+=' ok';else if(i===G.lastChoice)cls+=' bad';}
      return `<button class="${cls}" ${G.quizAnswered?'disabled':''} onclick="answerQuizWaehrend(${i})">
        <span class="quiz-opt-letter">${letters[i]}</span><span>${o}</span>
      </button>`;
    }).join('')}
  </div>
  ${G.quizAnswered?`
  <div class="quiz-expl show">
    <div class="quiz-expl-hed">${G.quizCorrect?'✓ Richtig!':'✗ Leider falsch.'}</div>
    ${q.erklaerung}
  </div>
  <div class="quiz-connection show"><strong>Zusammenhang:</strong> ${q.zusammenhang}</div>
  <button class="btn btn-ink" onclick="closeQuizWaehrend()">Zurück zur Verhandlung →</button>
  `:''}`;
}

function answerQuizWaehrend(i){
  if(G.quizAnswered)return;
  G.quizAnswered=true;G.lastChoice=i;
  G.quizCorrect=i===G.quizQueue[G.quizIdx].r;
  addScore(G.quizCorrect?10:3);
  render();
}

function closeQuizWaehrend(){
  G.quizWaehrendOffen=false;G.quizAnswered=false;render();
}

/* ════════════════════════════════════════════════════
   ABSCHLUSS
════════════════════════════════════════════════════ */
function renderAbschluss(){
  G.phaseIdx=3;
  const deal=G.finalDeal||0;
  const real=(deal-4.2);
  const scheitern=G.scheitern;
  return `
  <h2>${scheitern?'Verhandlung gescheitert':'Tarifabschluss'}</h2>

  ${scheitern?`
  <div class="rbox bad">Die Verhandlungen sind gescheitert. Was nun?</div>
  <div class="card card-blue">
    <h3>Was jetzt passiert — Ablauf im echten Tarifstreit</h3>
    <div style="font-size:13px;line-height:1.8;color:var(--blue)">
      1. <strong>Schlichtung:</strong> Beide Seiten einigen sich auf eine Schlichter/in.<br>
      2. Schlichter macht Kompromissvorschlag — kann abgelehnt werden.<br>
      3. Bei Ablehnung: <strong>Urabstimmung</strong> (mind. 75 % nötig für Streik).<br>
      4. Streik → Druck → neue Verhandlung oder Einigung.<br>
      5. Notfalls: Arbeitsgericht (selten bei Tarifkonflikten).
    </div>
  </div>
  <div class="rbox warn">Reales Beispiel: Der Bahnstreik 2023/24. GDL und DB scheiterten mehrfach — nach Monaten und Schlichtungsanläufen kam schließlich ein Abschluss zustande.</div>
  `:`
  <div class="stats-row">
    <div class="stat ${deal>=4.2?'green':'red'}"><div class="stat-val">+${deal.toFixed(1)} %</div><div class="stat-label">Lohnerhöhung</div></div>
    <div class="stat ${real>=0?'green':'red'}"><div class="stat-val">${real>=0?'+':''}${real.toFixed(1)} %</div><div class="stat-label">Reallohn</div></div>
  </div>

  <table>
    <thead><tr><th>Kennzahl</th><th class="td-r">Ergebnis</th></tr></thead>
    <tbody>
      <tr><td>Nominale Lohnerhöhung</td><td class="td-r">+${deal.toFixed(1)} %</td></tr>
      <tr><td>Inflation (Referenz)</td><td class="td-r">4,2 %</td></tr>
      <tr><td><strong>Reallohneffekt</strong></td><td class="td-r ${real>=0?'td-green':'td-red'}">${real>=0?'+':''}${real.toFixed(1)} %</td></tr>
      <tr><td>Laufzeit Tarifvertrag</td><td class="td-r">24 Monate</td></tr>
      <tr><td>Mehrkosten AG (Schätzung)</td><td class="td-r">+${(deal*1.15).toFixed(1)} Mio. €</td></tr>
    </tbody>
  </table>

  <div class="rbox ${real>=0?'ok':'warn'}">
    ${real>=0
      ? `Reallohnzuwachs von +${real.toFixed(1)} %! Die Beschäftigten gewinnen Kaufkraft zurück.`
      : `Reallohnverlust von ${real.toFixed(1)} %. Trotz Erhöhung verlieren die Beschäftigten Kaufkraft. Beim nächsten Mal früher und stärker Druck aufbauen.`}
  </div>

  <div class="card" style="margin-bottom:12px">
    <h3>Was bedeutet dieser Abschluss?</h3>
    <div style="font-size:13px;line-height:1.65;color:var(--gray)">
      Der vereinbarte Tarifvertrag gilt nun <strong>24 Monate</strong> für alle Beschäftigten der Mitgliedsbetriebe. Während dieser Zeit gilt die <strong>Friedenspflicht</strong> — kein Streik, keine Aussperrung. Erst nach Ablauf beginnt das Spiel von vorne.
    </div>
  </div>
  `}

  <button class="btn btn-ink" onclick="startQuizNach()">Abschlusslerncheck (${FRAGEN.filter(f=>f.phase==='nach'||f.phase==='waehrend').length} Fragen) →</button>`;
}

/* ════════════════════════════════════════════════════
   ERGEBNIS
════════════════════════════════════════════════════ */
function renderErgebnis(){
  G.phaseIdx=4;
  const pct=G.maxScore>0?Math.round(G.score/G.maxScore*100):0;
  const deal=G.finalDeal||0;
  const real=deal-4.2;
  let note,noteClass;
  if(pct>=85){note='Sehr gut — du kennst das Tarifrecht!';noteClass='ok';}
  else if(pct>=65){note='Gut — solides Grundwissen vorhanden.';noteClass='ok';}
  else if(pct>=45){note='Befriedigend — noch Lücken zu schließen.';noteClass='warn';}
  else{note='Noch Verbesserungsbedarf — nochmal durcharbeiten!';noteClass='bad';}

  return `
  <h2>Auswertung</h2>
  <div class="stats-row">
    <div class="stat blue"><div class="stat-val">${G.score}</div><div class="stat-label">Punkte gesamt</div></div>
    <div class="stat ${pct>=65?'green':'red'}"><div class="stat-val">${pct} %</div><div class="stat-label">Richtigquote</div></div>
  </div>
  <div class="rbox ${noteClass}">${note}</div>

  <div class="card" style="margin-bottom:12px">
    <h3>Dein Tarifabschluss</h3>
    ${G.scheitern?
      '<div class="rbox bad" style="margin:0">Verhandlung gescheitert — in der Realität würde jetzt die Schlichtung folgen.</div>':
      `<table style="margin:0">
        <tr><td>Einigung</td><td class="td-r">+${deal.toFixed(1)} %</td></tr>
        <tr><td>Reallohneffekt</td><td class="td-r ${real>=0?'td-green':'td-red'}">${real>=0?'+':''}${real.toFixed(1)} %</td></tr>
      </table>`}
  </div>

  <div class="section-label">Was du gelernt hast — Zusammenfassung</div>
  <div class="card card-blue">
    <div style="font-size:13px;line-height:1.85;color:var(--blue)">
      <strong>Art. 9 Abs. 3 GG</strong> → Tarifautonomie: Gewerkschaft + AG-Verband regeln eigenständig.<br>
      <strong>Tarifvertrag</strong> → gilt kollektiv, enthält Lohn/Zeit/Urlaub-Mindestbedingungen.<br>
      <strong>Friedenspflicht</strong> → kein Streik während laufendem TV.<br>
      <strong>Warnstreik</strong> → kurz, Druckmittel; <strong>Vollstreik</strong> → nach 75 % Urabstimmung.<br>
      <strong>Aussperrung</strong> → AG-Gegenmittel zum Streik (selten, umstritten).<br>
      <strong>Schlichtung</strong> → neutrale Vermittlung bei Blockade.<br>
      <strong>Reallohn</strong> = Nominallohn − Inflation → entscheidend für Kaufkraft.<br>
      <strong>Allgemeinverbindlichkeit</strong> → TV gilt für alle Betriebe der Branche.
    </div>
  </div>

  <div class="section-label">Begriffe als Übersicht</div>
  <div style="margin-bottom:12px">
    ${GLOSSAR.map(g=>`<span class="pill pill-blue" onclick="G.screen='glossar';G.glossarOpen=GLOSSAR.findIndex(x=>x.term==='${g.term}');render()" style="cursor:pointer">${g.term}</span>`).join('')}
  </div>

  <button class="btn btn-ink" onclick="G.screen='glossar';render()">Vollständiges Glossar ansehen</button>
  <button class="btn btn-ghost" onclick="restart()">Nochmal spielen</button>`;
}

/* ════════════════════════════════════════════════════
   VOLLGLOSSAR
════════════════════════════════════════════════════ */
function renderGlossar(){
  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <h2 style="margin:0">Glossar Tarifrecht</h2>
    <button style="font-size:12px;padding:5px 12px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--gray);cursor:pointer;font-family:var(--sans)" onclick="history.back?history.back():setScreen('ergebnis')">← Zurück</button>
  </div>
  <p>Tippe auf einen Begriff, um Definition, Beispiel und Zusammenhänge zu sehen.</p>
  <div class="card" style="margin-bottom:0">
    ${GLOSSAR.map((g,i)=>`
    <div class="glossar-entry">
      <div class="glossar-term" onclick="G.glossarOpen=G.glossarOpen===i?-1:i;render()">
        <span>${g.term}</span>
        <span class="glossar-term-tag">${g.tag}</span>
      </div>
      <div class="glossar-def ${G.glossarOpen===i?'open':''}">
        <div style="font-size:13px;line-height:1.65;color:var(--gray);margin-bottom:6px">${g.def}</div>
        <div class="glossar-bsp">${g.bsp}</div>
        <div class="glossar-zusammenhang">${g.zusammenhang}</div>
      </div>
    </div>`).join('')}
  </div>`;
}

function restart(){
  Object.assign(G,{screen:'start',score:0,maxScore:0,lohnForderung:6.0,gegenangebot:2.2,verhandlungsRunde:0,letzteAktion:null,finalDeal:null,scheitern:false,activeTab:'begriffe',glossarOpen:-1,lernkarteSide:'frage',lernkarteIdx:0,quizPhase:'vor',quizIdx:0,quizAnswered:false,quizCorrect:false,lastChoice:-1,quizQueue:[],phaseIdx:0,dialoge:[],quizWaehrendOffen:false,quizWaehrendGetan:false,begriffOpen:null});
  render();
}

function attachAll(){
  document.getElementById('mainbody').scrollTop=0;
}

render();

function toggleFullscreen(){
  const btn=document.getElementById('btn-fs');
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange',()=>{
  const btn=document.getElementById('btn-fs');
  if(btn) btn.textContent=document.fullscreenElement?'✕':'⛶';
});
</script>
</body>
</html>
